name: Package & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.5.3, leave blank to use manifest version)'
        required: false
        default: ''

jobs:
  build-and-release:
    name: Package & Release Extension
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      zip_name: ${{ steps.version_check.outputs.zip_name }}
      release_outcome: ${{ steps.release.outcome }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract & Verify Version
        id: version_check
        env:
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
        run: |
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          echo "Manifest version: $MANIFEST_VERSION"

          # Determine target tag / version
          if [ -n "$INPUT_TAG_NAME" ]; then
            TARGET_TAG="$INPUT_TAG_NAME"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TARGET_TAG="${GITHUB_REF#refs/tags/}"
          else
            TARGET_TAG="v$MANIFEST_VERSION"
          fi

          VERSION_WITHOUT_V="${TARGET_TAG#v}"
          echo "Target tag: $TARGET_TAG"
          echo "Version: $VERSION_WITHOUT_V"

          # Check if git tag matches manifest.json version
          if [ "$VERSION_WITHOUT_V" != "$MANIFEST_VERSION" ]; then
            echo "::error::Version mismatch! Tag is '$TARGET_TAG' (version: '$VERSION_WITHOUT_V') but manifest.json version is '$MANIFEST_VERSION'."
            echo "Please update manifest.json to match your release tag."
            exit 1
          fi

          ZIP_NAME="x-comment-blocker-${TARGET_TAG}.zip"
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "target_tag=$TARGET_TAG" >> "$GITHUB_OUTPUT"

      - name: Create Extension Package (.zip)
        env:
          ZIP_NAME: ${{ steps.version_check.outputs.zip_name }}
        run: |
          echo "Packaging extension into $ZIP_NAME..."

          # Package extension files excluding dev/repo metadata
          zip -r "$ZIP_NAME" . \
            -x ".git/*" \
            -x ".github/*" \
            -x "biome.json" \
            -x "*.md" \
            -x "*.zip" \
            -x "keywords.txt" \
            -x "LICENSE" \
            -x "*.DS_Store*" \
            -x "Thumbs.db"

          echo "Zip file created successfully. Contents:"
          unzip -l "$ZIP_NAME"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version_check.outputs.zip_name }}
          path: ${{ steps.version_check.outputs.zip_name }}
          retention-days: 30

      - name: Create or Update GitHub Release
        id: release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_TAG: ${{ steps.version_check.outputs.target_tag }}
          ZIP_NAME: ${{ steps.version_check.outputs.zip_name }}
        run: |
          EXTRA_ARGS=()
          if [[ "$TARGET_TAG" =~ -(alpha|beta|rc) ]]; then
            EXTRA_ARGS+=("--prerelease")
          fi

          if gh release view "$TARGET_TAG" > /dev/null 2>&1; then
            echo "Release '$TARGET_TAG' already exists, uploading/overwriting asset..."
            gh release upload "$TARGET_TAG" "$ZIP_NAME" --clobber
          else
            echo "Creating new release '$TARGET_TAG'..."
            gh release create "$TARGET_TAG" "$ZIP_NAME" \
              --title "$TARGET_TAG" \
              --generate-notes \
              "${EXTRA_ARGS[@]}"
          fi

      - name: Remove Chrome from Submit Keys
        id: firefox_keys
        env:
          SUBMIT_KEYS: ${{ secrets.SUBMIT_KEYS }}
        run: |
          keys=$(jq -c 'del(.chrome)' <<< "$SUBMIT_KEYS")
          echo "::add-mask::$keys"
          echo "keys=$keys" >> "$GITHUB_OUTPUT"

      - name: Publish to Firefox Add-ons
        uses: PlasmoHQ/bpp@v3
        with:
          keys: ${{ steps.firefox_keys.outputs.keys }}
          zip: ${{ steps.version_check.outputs.zip_name }}
          version-file: manifest.json

  publish-chrome:
    name: Publish to Chrome Web Store
    needs: build-and-release
    if: ${{ !cancelled() && needs.build-and-release.outputs.release_outcome == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: chrome-web-store
      cancel-in-progress: false

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-and-release.outputs.zip_name }}

      - name: Read Chrome Keys
        id: chrome_keys
        env:
          SUBMIT_KEYS: ${{ secrets.SUBMIT_KEYS }}
        run: |
          for field in clientId clientSecret refreshToken; do
            value=$(jq -er ".chrome.$field" <<< "$SUBMIT_KEYS")
            echo "::add-mask::$value"
            echo "$field=$value" >> "$GITHUB_OUTPUT"
          done

      - name: Publish to Chrome Web Store
        uses: hamzahamidi/publish-to-chrome-web-store@v1
        with:
          client-id: ${{ steps.chrome_keys.outputs.clientId }}
          client-secret: ${{ steps.chrome_keys.outputs.clientSecret }}
          refresh-token: ${{ steps.chrome_keys.outputs.refreshToken }}
          publisher-id: ${{ vars.CWS_PUBLISHER_ID }}
          item-id: gagacedifiphcndckimeihhcbcclkach
          zip: ${{ needs.build-and-release.outputs.zip_name }}
